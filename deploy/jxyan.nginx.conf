server {
    listen 80;
    server_name jxyan.coderoamer.cn;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name jxyan.coderoamer.cn;

    root /var/www/jxyan;
    index index.html;

    client_max_body_size 50m;

    ssl_certificate /etc/nginx/cert/cf_server.pem;
    ssl_certificate_key /etc/nginx/cert/cf_server.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    location /api/chat/stream {
        proxy_pass http://82.156.109.84:18878/chat/stream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://82.156.109.84:18878/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
